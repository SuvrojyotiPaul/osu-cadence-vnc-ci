name: VNC + SSH cross-platform checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: 'Ubuntu - TigerVNC'}
          - {os: windows-2025, label: 'Windows - TurboVNC'}
          - {os: macos-26, label: 'macOS Apple Silicon - TurboVNC'}
          - {os: macos-15-intel, label: 'macOS Intel - TurboVNC'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r requirements.txt
      - name: Install TigerVNC
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p reports
          sudo apt-get update
          sudo apt-get install -y tigervnc-viewer xvfb xauth | tee reports/install.log
      - name: Install TurboVNC on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/install-macos.sh
      - name: Install TurboVNC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-windows.ps1
      - name: Run real local OpenSSH + RFB protocol tests
        if: always()
        shell: bash
        run: python scripts/test_cross_platform.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-report-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
